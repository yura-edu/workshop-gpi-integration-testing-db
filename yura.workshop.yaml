# yura.workshop.yaml — declarative grader config
# Spec: docs/grader-workers-spec.md §6
# Generated from prisma/seeds/workshop-templates.seed.ts

schema_version: "1.0"
workshop:
  id: gpi-integration-testing-db
  title: "Pruebas de Integración con BD real"
  type: testing
  language: typescript
  passing_threshold: 70
  base_branch: main
submission:
  source: workshop_link
  required_inputs:
    - type: github_repo_url
      label: "URL del repositorio"
      required: true
    - type: github_pr_url
      label: "URL del Pull Request"
      required: true
evaluation_profile:
  - metric_id: test_coverage
    weight: 30
    threshold: 0.75
    config:
      runner: vitest
      coverage_tool: c8
      coverage_format: lcov
      report_path: coverage/lcov.info
      include_paths:
        - src/
      exclude_paths:
        - tests/
        - "**/__init__.py"
        - "**/*.spec.ts"
        - "**/*.test.ts"
      min_coverage_percent: 75
      min_coverage_per_file: 0
      timeout_seconds: 300
      extra_args: []
  - metric_id: test_pass_rate
    weight: 25
    threshold: 1
    config:
      runner: vitest
      report_format: vitest_json
      report_path: reports/test-results.json
      min_pass_rate_percent: 100
      timeout_seconds: 300
  - metric_id: integration_test_count
    weight: 20
    threshold: 8
    config:
      min_count: 8
      paths:
        - tests/integration/
  - metric_id: ci_pipeline_passes
    weight: 15
    threshold: 1
    config:
      provider: github_actions
      required_workflows: []
      mode: all_required_pass
      timeout_minutes_after_submit: 10
  - metric_id: config_file_valid_schema
    weight: 10
    threshold: 1
    config:
      target_file: .github/workflows/ci.yml
      schema_source: bundled
      schema_id: github-actions-workflow-1.0
      format: yaml
